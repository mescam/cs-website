apiVersion: apps/v1
kind: Deployment
metadata:
  name: zsr-demo
  namespace: zsr-gitops
  labels:
    app: zsr-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zsr-demo
  template:
    metadata:
      labels:
        app: zsr-demo
    spec:
      containers:
        - name: web
          image: nginx:1.30.7
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: page
          configMap:
            name: zsr-demo
